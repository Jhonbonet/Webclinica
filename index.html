<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Hospitalario Autenticado</title>
    <style>
        :root {
            --primary: #0077b6;
            --primary-hover: #03045e;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #dee2e6;
            --success: #2a9d8f;
            --danger: #e63946;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; }
        .login-wrapper { max-width: 400px; width: 100%; margin: 0 auto; }
        .login-header { text-align: center; margin-bottom: 25px; }
        .login-header h1 { color: var(--primary); font-size: 1.8rem; }
        
        .password-container { position: relative; display: flex; align-items: center; }
        .password-container input { padding-right: 45px; }
        .toggle-password { position: absolute; right: 12px; cursor: pointer; font-size: 1.2rem; color: #6c757d; }

        .hidden { display: none !important; }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .app-header h2 { color: var(--primary); }
        .user-badge { background-color: #e2e3e5; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .btn-logout { background-color: var(--danger); padding: 5px 10px; font-size: 0.8rem; width: auto; color: white; border: none; border-radius: 4px; cursor: pointer; }

        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); }
        h3 { margin-bottom: 20px; font-size: 1.3rem; border-bottom: 2px solid var(--background); padding-bottom: 10px; color: #343a40; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; outline: none; }
        select:disabled, input:disabled { background-color: #e9ecef; color: #495057; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:hover { background-color: var(--primary-hover); }
        .error-msg { color: var(--danger); font-size: 0.9rem; margin-top: 10px; text-align: center; font-weight: bold; }
        .info-alert { background-color: #e2e3e5; padding: 12px; border-radius: 4px; margin-bottom: 15px; font-style: italic; }
        
        .nota-item { background: var(--background); border-left: 4px solid var(--primary); padding: 15px; border-radius: 0 4px 4px 0; margin-bottom: 15px; }
        .nota-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #6c757d; margin-bottom: 8px; }
        .nota-vitals { font-weight: bold; color: var(--success); margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- ================= VISTA LOGIN ================= -->
    <div id="vista-login" class="login-wrapper">
        <div class="card">
            <div class="login-header">
                <h1>🩺 Control Clínico</h1>
                <p>Acceso Seguro de Enfermería</p>
            </div>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-usuario">Usuario:</label>
                    <input type="text" id="login-usuario" required placeholder="Ej: enfermera_lucia">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                    <div class="password-container">
                        <input type="password" id="login-password" required placeholder="••••••••">
                        <span id="btn-toggle-pass" class="toggle-password">👁️</span>
                    </div>
                </div>
                <button type="submit" id="btn-entrar">Iniciar Sesión</button>
                <div id="login-error" class="error-msg hidden"></div>
            </form>
        </div>
    </div>

    <!-- ================= VISTA PRINCIPAL ================= -->
    <div id="vista-app" class="container hidden">
        <header class="app-header">
            <div>
                <h2>🩺 Módulo de Enfermería</h2>
                <p>Expediente y Notas Médicas en Tiempo Real</p>
            </div>
            <div class="user-badge">
                <span>👤 <span id="sesion-nombre">Nombre</span> (<span id="sesion-rol">Rol</span>)</span>
                <button class="btn-logout" id="btn-salir">Salir</button>
            </div>
        </header>

        <main class="grid-layout">
            <!-- Formulario de Notas -->
            <section class="card form-section">
                <h3>📝 Registrar Evolución</h3>
                <form id="form-nota">
                    <div class="form-group">
                        <label for="input-enfermera-firma">Firmado Por (Auto):</label>
                        <input type="text" id="input-enfermera-firma" disabled value="Cargando perfil...">
                    </div>

                    <div class="form-group">
                        <label for="select-paciente">Paciente Seleccionado:</label>
                        <select id="select-paciente" required>
                            <option value="">Seleccione un paciente...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="signos-vitales">Signos Vitales:</label>
                        <input type="text" id="signos-vitales" placeholder="Ej: PA: 110/70, Temp: 36.2°C" required>
                    </div>

                    <div class="form-group">
                        <label for="observaciones">Observaciones Clínicas:</label>
                        <textarea id="observaciones" rows="4" placeholder="Escriba aquí los detalles detectados en el turno..." required></textarea>
                    </div>

                    <button type="submit" id="btn-guardar">Guardar Nota Médica</button>
                </form>
            </section>

            <!-- Historial Compartido -->
            <section class="card history-section">
                <h3>📋 Línea de Tiempo del Paciente</h3>
                <div id="info-paciente-seleccionado" class="info-alert">
                    Seleccione un paciente para auditar el historial de notas compartidas.
                </div>
                <div class="timeline" id="contenedor-notas"></div>
            </section>
        </main>
    </div>

    <script>
        let usuarioLogueado = null;

        document.addEventListener('DOMContentLoaded', () => {
            const btnTogglePass = document.getElementById('btn-toggle-pass');
            const inputPass = document.getElementById('login-password');

            btnTogglePass.addEventListener('click', () => {
                if (inputPass.type === 'password') {
                    inputPass.type = 'text';
                    btnTogglePass.textContent = '🙈';
                } else {
                    inputPass.type = 'password';
                    btnTogglePass.textContent = '👁️';
                }
            });

            document.getElementById('form-login').addEventListener('submit', ejecutarLogin);
            document.getElementById('btn-salir').addEventListener('click', cerrarSesion);
            document.getElementById('select-paciente').addEventListener('change', (e) => {
                if(e.target.value) cargarHistorialNotas(e.target.value);
                else limpiarHistorial();
            });
            document.getElementById('form-nota').addEventListener('submit', guardarNota);
        });

        function ejecutarLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-entrar');
            const errorDiv = document.getElementById('login-error');
            btn.disabled = true; btn.textContent = "Verificando...";
            errorDiv.classList.add('hidden');

            const usuario = document.getElementById('login-usuario').value;
            const pass = document.getElementById('login-password').value;

            google.script.run.withSuccessHandler(resultado => {
                btn.disabled = false; btn.textContent = "Iniciar Sesión";

                if (resultado.exito) {
                    usuarioLogueado = resultado.usuario;
                    document.getElementById('sesion-nombre').textContent = usuarioLogueado.nombre;
                    document.getElementById('sesion-rol').textContent = usuarioLogueado.rol;
                    document.getElementById('input-enfermera-firma').value = usuarioLogueado.nombre;
                    
                    document.getElementById('vista-login').classList.add('hidden');
                    document.getElementById('vista-app').classList.remove('hidden');
                    document.body.style.display = "block";
                    inicializarApp();
                } else {
                    errorDiv.textContent = resultado.mensaje;
                    errorDiv.classList.remove('hidden');
                }
            }).verificarLogin(usuario, pass);
        }

        function inicializarApp() {
            google.script.run.withSuccessHandler(pacientes => {
                const select = document.getElementById('select-paciente');
                select.innerHTML = '<option value="">Seleccione un paciente...</option>';
                pacientes.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p.id_paciente;
                    opt.textContent = `${p.nombre} ${p.apellido}`;
                    select.appendChild(opt);
                });
            }).obtenerDatosTabla('Pacientes');
        }

        function cargarHistorialNotas(idPaciente) {
            const contenedor = document.getElementById('contenedor-notas');
            const info = document.getElementById('info-paciente-seleccionado');
            info.textContent = "Cargando historial auditado...";
            
            google.script.run.withSuccessHandler(notas => {
                contenedor.innerHTML = '';
                if(notas.length === 0) {
                    info.textContent = "No existen registros previos para este paciente.";
                    return;
                }
                info.textContent = `Mostrando ${notas.length} notas visibles para todo el personal autorizado.`;
                
                notas.reverse().forEach(nota => {
                    const div = document.createElement('div');
                    div.className = 'nota-item';
                    div.innerHTML = `
                        <div class="nota-header">
                            <span>📅 ${nota.fecha} - ⏰ ${nota.hora}</span>
                            <span>👩‍⚕️ Registrado por: <strong>${nota.nombre_enfermera}</strong></span>
                        </div>
                        <div class="nota-vitals">📊 Signos: ${nota.signos_vitales}</div>
                        <p>👁️ <strong>Evolución:</strong> ${nota.observaciones}</p>
                    `;
                    contenedor.appendChild(div);
                });
            }).obtenerNotasPaciente(idPaciente);
        }

        function guardarNota(e) {
            e.preventDefault();
            if(!usuarioLogueado.id_enfermera){
                alert("Error: Tu cuenta de usuario no está vinculada a un ID de Enfermera válido.");
                return;
            }

            const btn = document.getElementById('btn-guardar');
            btn.disabled = true; btn.textContent = "Guardando firma digital...";
            const idPaciente = document.getElementById('select-paciente').value;

            const nuevaNota = {
                id_paciente: idPaciente,
                id_enfermera: usuarioLogueado.id_enfermera,
                signos_vitales: document.getElementById('signos-vitales').value,
                observaciones: document.getElementById('observaciones').value
            };

            google.script.run.withSuccessHandler(resultado => {
                btn.disabled = false; btn.textContent = "Guardar Nota Médica";
                if(resultado.exito) {
                    document.getElementById('signos-vitales').value = '';
                    document.getElementById('observaciones').value = '';
                    cargarHistorialNotas(idPaciente);
                } else {
                    alert("Error: " + resultado.mensaje);
                }
            }).guardarNotaEnfermeria(nuevaNota);
        }

        function limpiarHistorial() {
            document.getElementById('contenedor-notas').innerHTML = '';
            document.getElementById('info-paciente-seleccionado').textContent = "Seleccione un paciente para auditar el historial de notas compartidas.";
        }

        function cerrarSesion() {
            usuarioLogueado = null;
            document.getElementById('login-usuario').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('vista-app').classList.add('hidden');
            document.getElementById('vista-login').classList.remove('hidden');
            document.body.style.display = "flex";
            limpiarHistorial();
        }
    </script>
</body>
</html>
